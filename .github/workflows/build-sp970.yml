name: Build_sp970
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Starting full OpenWrt compilation..."
          # 检查编译脚本是否存在
          if [ -f scripts/build.sh ]; then
            bash scripts/build.sh
          else
            echo "Error: scripts/build.sh not found!"
            exit 1
          fi
