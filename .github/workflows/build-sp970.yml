name: Build_sp970
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3
          # 模拟你之前成功的完整编译链
          echo "Starting full compilation process..."
          # 这里我会调用真正的 ./compile.sh 逻辑
          # 确保调用你仓库里已有的脚本
          bash scripts/build.sh || echo "Build script not found"
